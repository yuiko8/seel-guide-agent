<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cut">
  <meta name="theme-color" content="#0f766e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>Atlas Shopping Assistant</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icon-192.png">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="app">
    <header class="top">
      <div class="brand">
        <img src="/icon.svg" alt="" width="28" height="28">
        <div>
          <div class="brand-name">Atlas</div>
          <div class="brand-sub" id="status-line">Shopping assistant · ships worldwide</div>
        </div>
      </div>
      <button class="icon-btn" id="new-chat" aria-label="Start a new chat" title="New chat">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/></svg>
      </button>
    </header>

    <div class="banner" id="banner" hidden></div>

    <main class="thread" id="thread" aria-live="polite">
      <section class="welcome" id="welcome">
        <h1>Find it, see the real cost, ship it anywhere.</h1>
        <p>Tell me what you're shopping for and where it's going. I'll show delivery times and import taxes up front.</p>
        <div class="chips" id="starter-chips">
          <button class="chip">Noise-cancelling headphones under $150 to Germany</button>
          <button class="chip">A cozy gift for my mom in Canada</button>
          <button class="chip">How long does shipping to Australia take?</button>
        </div>
      </section>
    </main>

    <form class="composer" id="composer" autocomplete="off">
      <textarea id="input" rows="1" placeholder="Ask about a product, delivery or taxes…" aria-label="Message" maxlength="2000"></textarea>
      <button type="submit" id="send" class="send" aria-label="Send">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M4 12l16-8-6 16-2.5-6.5L4 12z" fill="currentColor"/></svg>
      </button>
    </form>
  </div>
  <script type="module" src="/app.js"></script>
</body>
</html>
